org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
# AGP 9 embarque Kotlin de facon interne et entre en conflit avec le plugin
# org.jetbrains.kotlin.android applique explicitement ("Cannot add extension
# with name 'kotlin'") -> opt-out officiel (absent dans AGP 10, a retirer avec
# la migration complete vers le Kotlin integre le jour venu).
android.builtInKotlin=false
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
