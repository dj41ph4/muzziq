name: Publication de l'image Docker
run-name: Publication Docker — ${{ github.ref_name }}

# Construit packaging/docker/Dockerfile et la publie sur Docker Hub à chaque
# mise à jour de master — même mécanisme que Movviz (§1.1 du plan
# d'architecture), adapté au nom de branche réel de ce dépôt.
#
# Prérequis pour que ce workflow fonctionne (à faire une seule fois, côté
# GitHub, pas modifiable depuis ce dépôt) : ajouter deux secrets dans
# Settings > Secrets and variables > Actions du dépôt GitHub —
# DOCKERHUB_USERNAME et DOCKERHUB_TOKEN (un access token Docker Hub, pas le
# mot de passe du compte). Sans ces secrets, ce workflow échoue à l'étape
# de connexion — jamais testé en conditions réelles dans cet environnement
# (ni Docker ni accès à un compte Docker Hub ici).
on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: docker-publish
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            latest_tag: latest
          - arch: arm64
            platform: linux/arm64
            latest_tag: latest-arm64
    runs-on: ubuntu-latest
    steps:
      - name: Récupération du dépôt
        uses: actions/checkout@v4

      - name: Connexion à Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Configuration de QEMU pour ARM
        uses: docker/setup-qemu-action@v3
        if: matrix.arch == 'arm64'
        with:
          image: tonistiigi/binfmt:qemu-v7.0.0-28

      - name: Configuration de Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Construction et publication (${{ matrix.platform }})
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packaging/docker/Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/muzziq:${{ matrix.latest_tag }}
            ${{ secrets.DOCKERHUB_USERNAME }}/muzziq:latest-${{ matrix.arch }}
            ${{ secrets.DOCKERHUB_USERNAME }}/muzziq:sha-${{ github.sha }}-${{ matrix.arch }}
          cache-from: type=gha,scope=muzziq-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=muzziq-${{ matrix.arch }}
          provenance: false

  manifest:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Connexion à Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Création des manifests multi-architecture
        env:
          IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/muzziq
          SHA: ${{ github.sha }}
        run: |
          docker buildx imagetools create \
            --tag "$IMAGE:latest" \
            --tag "$IMAGE:sha-${SHA}" \
            "$IMAGE:latest-amd64" \
            "$IMAGE:latest-arm64"
