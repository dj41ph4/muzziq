name: Build APK Android

run-name: Build Android — ${{ github.ref_name }}

# Construit android-mobile/ et publie un APK release signé à chaque push sur
# master, ou à la demande — même mécanisme que docker-publish.yml (§1.1 du
# plan d'architecture) et repris de la structure réelle du workflow Android
# smartphone de Movviz (.github/workflows/android-mobile-build.yml), adapté
# aux noms de secrets/branche/module de ce dépôt.
#
# Prérequis pour que la signature release fonctionne (à faire une seule fois,
# côté GitHub, pas modifiable depuis ce dépôt) : ajouter quatre secrets dans
# Settings > Secrets and variables > Actions du dépôt GitHub —
# MUZZIQ_ANDROID_KEYSTORE_B64, MUZZIQ_ANDROID_KEYSTORE_PASSWORD,
# MUZZIQ_ANDROID_KEY_ALIAS, MUZZIQ_ANDROID_KEY_PASSWORD. Sans ces secrets, ce
# workflow génère une clé de CI éphémère (build non signé de façon stable —
# chaque run produit un APK signé différemment, l'installation écrasera
# l'appli existante au lieu de la mettre à jour) plutôt que d'échouer —
# jamais testé avec une vraie clé retail dans cet environnement (ni SDK
# Android, ni gradle, ni accès à un compte GitHub Actions ici).
on:
  push:
    branches: [master]
    paths:
      - "android-mobile/**"
      - ".github/workflows/android-build.yml"
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupération du dépôt
        uses: actions/checkout@v4

      - name: Configuration JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configuration du SDK Android
        uses: android-actions/setup-android@v3

      - name: Installation de la plateforme et des build-tools
        run: sdkmanager "platforms;android-37" "build-tools;35.0.0"

      - name: Configuration de Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      # Seule vraie vérification disponible pour le code de domaine (ProviderRegistry,
      # etc.) : aucun SDK/émulateur Android dans l'environnement de développement de ce
      # dépôt, donc ces tests JVM purs (app/src/test/) ne tournent jamais qu'ici. Ne pas
      # supprimer/contourner cette étape pour "aller plus vite" — c'est la seule certitude
      # réelle qu'on ait sur ce code avant qu'un appareil physique ne l'exécute.
      - name: Tests unitaires JVM (domain/, voir app/src/test/)
        working-directory: android-mobile
        run: gradle testDebugUnitTest --no-daemon

      - name: Préparation de la clé de signature release
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.MUZZIQ_ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.MUZZIQ_ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.MUZZIQ_ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.MUZZIQ_ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          key_dir="$RUNNER_TEMP/muzziq-signing"
          mkdir -p "$key_dir"
          keystore="$key_dir/muzziq-release.jks"
          store_password="${ANDROID_KEYSTORE_PASSWORD:-muzziq-ci-release-only}"
          key_alias="${ANDROID_KEY_ALIAS:-muzziq-release}"
          key_password="${ANDROID_KEY_PASSWORD:-$store_password}"
          if [ -n "${ANDROID_KEYSTORE_B64:-}" ]; then
            printf '%s' "$ANDROID_KEYSTORE_B64" | base64 --decode > "$keystore"
          else
            echo "::warning::Secrets de signature release absents — génération d'une clé de CI éphémère (pas de mise à jour propre d'un APK déjà installé avec une vraie clé)."
            keytool -genkeypair -v -keystore "$keystore" -storetype PKCS12 -alias "$key_alias" \
              -keyalg RSA -keysize 4096 -validity 10000 \
              -storepass "$store_password" -keypass "$key_password" \
              -dname "CN=MuzziQ, OU=Android, O=MuzziQ, C=FR"
          fi
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$keystore" "$store_password" "$key_alias" "$key_password" > android-mobile/keystore.properties

      # Même correctif que Movviz : dérive versionName/versionCode du tag Git
      # plutôt que la valeur figée dans build.gradle.kts, pour qu'une release
      # taguée affiche la vraie version installée.
      - name: Calcul de la version depuis le tag Git
        id: ver
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            tag="${GITHUB_REF_NAME#v}"
            IFS='.' read -r major minor patch <<< "$tag"
            code=$(( 10#$major * 10000 + 10#${minor:-0} * 100 + 10#${patch:-0} ))
            echo "name=$tag" >> "$GITHUB_OUTPUT"
            echo "code=$code" >> "$GITHUB_OUTPUT"
          else
            echo "name=" >> "$GITHUB_OUTPUT"
            echo "code=" >> "$GITHUB_OUTPUT"
          fi

      - name: Construction de l'APK release
        # gradle (fourni par gradle/actions/setup-gradle ci-dessus), pas
        # ./gradlew : ce dépôt ne committe pas de wrapper binaire
        # (gradle-wrapper.jar) — même choix que Movviz (android-mobile-build.yml).
        working-directory: android-mobile
        run: |
          gradle assembleRelease --no-daemon \
            ${{ steps.ver.outputs.name != '' && format('-PmuzziqVersionName={0} -PmuzziqVersionCode={1}', steps.ver.outputs.name, steps.ver.outputs.code) || '' }}

      - name: Renommage de l'APK
        run: cp android-mobile/app/build/outputs/apk/release/app-release.apk android-mobile/app/build/outputs/apk/release/MuzziQ-Android.apk

      - name: Publication de l'artefact APK
        uses: actions/upload-artifact@v4
        with:
          name: MuzziQ-Android
          path: android-mobile/app/build/outputs/apk/release/MuzziQ-Android.apk

      - name: Ajout de l'APK à la release GitHub
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: android-mobile/app/build/outputs/apk/release/MuzziQ-Android.apk
          append_body: true
          body: |
            ---
            **MuzziQ-Android.apk** — client Android natif (Jetpack Compose, Media3/ExoPlayer, Android Auto). Fonctionne en local (standalone) ou connecté à un serveur MuzziQ.
